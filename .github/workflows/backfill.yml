name: Run Backfill Scraper

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (YYYY-MM-DD)'
        required: true
        default: '2021-01-01'
      end_date:
        description: 'End Date (YYYY-MM-DD)'
        required: true
        default: '2026-09-25'
      chunks:
        description: 'Jumlah scraper paralel (mulai kecil, mis. 4, lalu naikkan)'
        required: true
        default: '4'
      skeleton_every:
        description: 'Tahap kerangka: ambil 1 hari tiap N hari lebih dulu (0 = lewati)'
        required: true
        default: '45'
      target:
        description: 'Item yang di-scrape (pilihan dari scraper/config.py; jalankan scraper/sync_workflow.py setelah mengubah config)'
        required: true
        type: choice
        default: '(semua item aktif)'
        options:
          # BEGIN-OPTIONS (dibuat otomatis oleh scraper/sync_workflow.py, jangan diedit manual)
          - "(semua item aktif)"
          - "growscan"
          # END-OPTIONS
      items:
        description: 'Opsional: ketik beberapa item sekaligus (mis. growscan,ghc atau preset:harian). Mengalahkan dropdown.'
        required: false
        default: ''

permissions:
  contents: read
  actions: write   # agar tiap scraper bisa menjalankan dirinya sendiri untuk melanjutkan

# Run dengan pilihan yang sama tidak boleh tumpang tindih;
# rentang berbeda (potongan paralel) boleh berjalan bersamaan.
concurrency:
  group: scraper-${{ inputs.start_date }}-${{ inputs.end_date }}-${{ inputs.chunks }}-${{ inputs.target }}-${{ inputs.items }}
  cancel-in-progress: false

jobs:
  # 1) Periksa pilihan item (gagal cepat bila salah ketik) dan bagi rentang tanggal menjadi N potongan.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      select: ${{ steps.sel.outputs.select }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - id: sel
        name: Validate item selection
        env:
          TARGET: ${{ inputs.target }}
          ITEMS: ${{ inputs.items }}
        run: |
          if [ -n "$ITEMS" ]; then SELECT="$ITEMS"
          elif [ "$TARGET" = "(semua item aktif)" ]; then SELECT=""
          else SELECT="$TARGET"; fi
          python scraper/show_config.py --check "$SELECT"
          echo "select=$SELECT" >> "$GITHUB_OUTPUT"

      - id: split
        name: Split date range
        env:
          START: ${{ inputs.start_date }}
          END: ${{ inputs.end_date }}
          CHUNKS: ${{ inputs.chunks }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import date, timedelta
          start = date.fromisoformat(os.environ["START"])
          end = date.fromisoformat(os.environ["END"])
          total = (end - start).days + 1
          n = max(1, min(int(os.environ["CHUNKS"]), total, 20))
          size, extra = divmod(total, n)
          include, cur = [], start
          for i in range(n):
              last = cur + timedelta(days=size + (1 if i < extra else 0) - 1)
              include.append({"id": i + 1, "start": cur.isoformat(), "end": last.isoformat()})
              cur = last + timedelta(days=1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": include}) + "\n")
          for c in include:
              print(c)
          PY

  # 2) Kerangka: 1 hari tiap N hari, dikerjakan berurutan dari terbaru ke terlama.
  #    Ini menyebar titik acuan harga agar tiap potongan paralel tahu skala harga di zamannya.
  skeleton:
    needs: plan
    if: ${{ inputs.skeleton_every != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: ./scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Scrape skeleton days
        env:
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          START: ${{ inputs.start_date }}
          END: ${{ inputs.end_date }}
          EVERY: ${{ inputs.skeleton_every }}
          SELECT: ${{ needs.plan.outputs.select }}
        run: |
          ARGS=()
          if [ -n "$SELECT" ]; then ARGS+=(--items "$SELECT"); fi
          python pipeline.py --backfill "$START" "$END" --every "$EVERY" --max-minutes 330 "${ARGS[@]}"

  # 3) Scraper paralel: tiap potongan memproses harinya dari terbaru ke terlama.
  scrape:
    needs: [plan, skeleton]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.skeleton.result == 'success' || needs.skeleton.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: ./scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Scrape chunk ${{ matrix.id }} (${{ matrix.start }} to ${{ matrix.end }})
        id: scrape
        env:
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          SELECT: ${{ needs.plan.outputs.select }}
        run: |
          ARGS=()
          if [ -n "$SELECT" ]; then ARGS+=(--items "$SELECT"); fi
          python pipeline.py --backfill "$START" "$END" --max-minutes 330 "${ARGS[@]}"

      # Kalau potongan ini belum selesai, jalankan lagi hanya potongan ini (dengan pilihan item yang sama).
      # Hari yang sudah selesai otomatis dilewati lewat tabel scrape_log.
      - name: Continue this chunk in a new run
        if: steps.scrape.outputs.remaining != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          SELECT: ${{ needs.plan.outputs.select }}
        run: >
          gh workflow run "${{ github.workflow }}"
          -f start_date="$START" -f end_date="$END" -f chunks=1 -f skeleton_every=0 -f items="$SELECT"